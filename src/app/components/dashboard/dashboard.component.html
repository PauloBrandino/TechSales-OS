<div class="min-h-screen bg-gray-50">
  <!-- Header Simples -->
  <header class="bg-white shadow p-4 mb-6">
    <h1 class="text-2xl font-bold text-gray-800">TechSales OS</h1>
  </header>

  <div class="p-4 container mx-auto">
    <p-tabView>
      <!-- Visão Comercial -->
      <p-tabPanel header="Comercial">
        <div class="card bg-white rounded-lg shadow p-4">
          <h2 class="text-xl font-semibold mb-4 text-gray-700">Oportunidades em Andamento</h2>

          <p-table [value]="deals()" [tableStyle]="{ 'min-width': '50rem' }">
            <ng-template pTemplate="header">
              <tr>
                <th class="p-3 text-left">Cliente</th>
                <th class="p-3 text-left">Valor</th>
                <th class="p-3 text-left">Estágio</th>
                <th class="p-3 text-left">Status PoC</th>
                <th class="p-3 text-left">Ações</th>
              </tr>
            </ng-template>
            <ng-template pTemplate="body" let-deal>
              <tr [class.bg-red-50]="deal.pocStatus === 'failed'">
                <td class="p-3 font-medium">{{ deal.client }}</td>
                <td class="p-3">{{ deal.value }}</td>
                <td class="p-3">
                  <p-tag [value]="deal.stage | uppercase" severity="info"></p-tag>
                </td>
                <td class="p-3">
                  <p-tag
                    [value]="deal.pocStatus | uppercase"
                    [severity]="deal.pocStatus === 'success' ? 'success' : (deal.pocStatus === 'failed' ? 'danger' : 'warning')">
                  </p-tag>
                </td>
                <td class="p-3">
                  <div *ngIf="deal.pocStatus !== 'success'">
                    <button
                      pButton
                      icon="pi pi-lock"
                      label="Bloqueado"
                      class="p-button-danger p-button-sm p-button-outlined"
                      [disabled]="true">
                    </button>
                  </div>
                  <div *ngIf="deal.pocStatus === 'success'">
                    <button
                      pButton
                      icon="pi pi-arrow-right"
                      label="Avançar"
                      class="p-button-success p-button-sm">
                    </button>
                  </div>
                </td>
              </tr>
            </ng-template>
          </p-table>
        </div>
      </p-tabPanel>

      <!-- Visão Técnica -->
      <p-tabPanel header="Técnica">
        <div class="card bg-white rounded-lg shadow p-4">
          <h2 class="text-xl font-semibold mb-4 text-gray-700">PoCs Ativas</h2>

          <p-table [value]="deals()" [tableStyle]="{ 'min-width': '50rem' }">
             <ng-template pTemplate="header">
              <tr>
                <th class="p-3 text-left">Cliente</th>
                <th class="p-3 text-left">Status PoC</th>
                <th class="p-3 text-left">Engenharia</th>
              </tr>
            </ng-template>
             <ng-template pTemplate="body" let-deal>
              <tr>
                <td class="p-3 font-medium">{{ deal.client }}</td>
                 <td class="p-3">
                  <p-tag
                    [value]="deal.pocStatus | uppercase"
                    [severity]="deal.pocStatus === 'success' ? 'success' : (deal.pocStatus === 'failed' ? 'danger' : 'warning')">
                  </p-tag>
                </td>
                <td class="p-3">
                  <!-- Exemplo de ação técnica -->
                  <span class="text-sm text-gray-500">Aguardando validação</span>
                </td>
              </tr>
             </ng-template>
          </p-table>
        </div>
      </p-tabPanel>
    </p-tabView>
  </div>
</div>
